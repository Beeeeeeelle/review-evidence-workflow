<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Review Workbench</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="evidence-reader.css"></head>
<body><header class="topbar"><div><span class="eyebrow">HUMAN REVIEW · SOURCE EVIDENCE</span><h1 id="projectTitle">Evidence review workbench</h1></div><div class="header-actions"><span id="reviewerLabel"></span><button id="importButton">Import progress</button><input type="file" id="importFile" accept="application/json" hidden><button class="primary" id="exportButton">Export review</button></div></header>
<div class="workspace"><nav class="paper-rail" aria-label="Assigned reports"><div class="rail-head"><p id="overallProgress"></p><label for="search">Find a report</label><input id="search" type="search" placeholder="Title, DOI or ID"><label for="filter">Show</label><select id="filter"><option value="all">All assigned</option><option value="pending">Work remaining</option><option value="issues">Needs resolution</option><option value="processed">All fields processed</option></select></div><div id="recordList"></div><p class="rail-foot"><span id="workflowHint">Accepting a field records your assessment. Challenges and uncertain items remain for resolution.</span></p></nav>
<main class="coding-pane"><section class="mode-banner"><strong id="modeInfo"></strong><p id="assignmentInstructions"></p><small id="codebookInfo"></small></section><div id="recordHeader"></div><nav id="stages" class="stages" aria-label="Coding stages"></nav><div id="fields"></div></main>
<aside id="pdfPane" class="pdf-pane" aria-label="Complete source document"><div class="pdf-toolbar"><strong id="sourceLabel">Source</strong><div class="pdf-actions"><button id="prevPage" aria-label="Previous page">←</button><label for="pageNumber">PDF page</label><input id="pageNumber" type="number" min="1" value="1"><span id="pageTotal"></span><button id="nextPage" aria-label="Next page">→</button><select id="zoom" aria-label="Page zoom"><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select><a id="openPdf" target="_blank" rel="noopener">Open PDF</a></div></div><div id="pdfStage"><img id="pageImage" alt="Source PDF page" hidden><iframe id="pdfFrame" title="Complete source PDF"></iframe><p id="pdfError" hidden>Page preview unavailable. Use Open PDF to inspect the complete source.</p></div></aside></div>
<div id="toast" role="status" aria-live="polite"></div><script src="data.js"></script><script src="evidence-reader.js"></script><script src="app.js"></script></body></html>
