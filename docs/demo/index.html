<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>从文献清单，到有依据的审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141d23;color:#f3f0e8;font:15px/1.6 system-ui,sans-serif}header{padding:22px 28px 18px;border-bottom:1px solid #35434c;max-width:1700px;margin:auto}h1{font-size:27px;font-weight:650;line-height:1.4;margin:8px 0 7px}p{margin:6px 0;color:#bac7ce;font-size:14px}.eyebrow{color:#ffac73;font-size:11px;letter-spacing:.12em}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}.languages,.editions{display:flex;gap:8px;flex-wrap:wrap}.editions{margin-top:18px}.editions button{padding:10px 16px;font-size:14px}.languages button{padding:5px 10px;font-size:12px}button{border:1px solid #40515d;background:transparent;color:#d5e0e7;border-radius:4px;font:inherit;cursor:pointer}button:hover{background:#23323e}button[aria-pressed="true"]{border-color:#d48b60;color:#ffbb8f;background:#26343b}button:focus-visible,a:focus-visible{outline:2px solid #ffac73;outline-offset:2px}main{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:22px;padding:22px 28px;max-width:1700px;margin:auto}video{width:100%;display:block;background:#080d11;border:1px solid #3a4852;border-radius:4px}.chapters{height:calc(100vh - 270px);min-height:350px;overflow:auto}.chapters h2{margin:0 0 9px;font-size:14px;color:#d5dfe3}.chapters button{display:block;width:100%;padding:10px 12px;text-align:left;border:1px solid transparent;border-bottom-color:#34424c;font:13px/1.5 system-ui}.chapters button.active{background:#2a3b43;border-color:#a87155;color:#fff}.chapters button span{display:block;color:#ffac73;font-size:11px;margin-bottom:3px}a{color:#ffac73}footer{max-width:1700px;margin:auto;padding:0 28px 28px;color:#aab8c2;font-size:12px}details{margin-top:12px}summary{cursor:pointer;color:#b6c4cc}.current{min-height:25px;font-size:13px;margin-top:10px}.time{color:#ffac73;font-variant-numeric:tabular-nums}.hint{font-size:12px;color:#a3b2bc}.links{display:flex;gap:16px;flex-wrap:wrap}.legend{color:#bac7ce;font-size:12px;margin-top:10px}.dot{color:#ffac73}.teal{color:#79d8cc}@media(max-width:850px){main{display:block;padding:14px}.chapters{height:290px;min-height:0;margin-top:20px}header{padding:17px}h1{font-size:21px}footer{padding:0 17px 20px}.topline{align-items:flex-start}.eyebrow{max-width:210px}}
</style></head><body>
<header><div class="topline"><div class="eyebrow">LITERATURE PDF RETRIEVAL<br>+ REVIEW EVIDENCE WORKFLOW</div><div class="languages" aria-label="Language"><button type="button" data-lang="zh-CN" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div></div><h1 id="heading">从文献清单，到有依据的审阅</h1><p id="subtitle">先认识两个 skill 怎样配合，再看实际工作台怎样操作。</p><div class="editions" aria-label="Video"><button type="button" data-kind="intro" aria-pressed="true">① 先认识两个 skill</button><button type="button" data-kind="pilot" aria-pressed="false">② 再看实际操作</button></div></header>
<main><section><video id="film" controls playsinline preload="metadata"></video><p class="current"><span class="time" id="position">00:00</span>　<span id="chapter"></span></p><p class="hint" id="hint"></p><p class="legend" id="legend"></p></section><nav class="chapters" aria-label="视频章节"><h2 id="chapters-title">想先看哪一步？</h2><div id="chapter-buttons"></div></nav></main>
<footer><div class="links"><a id="download" download>下载视频</a><a id="transcript">阅读解说</a><a id="guide">使用指南</a></div><details><summary id="source-summary">画面与标注说明</summary><p id="source-note"></p></details><p><a href="https://github.com/Beeeeeeelle/literature-pdf-retrieval">Literature PDF Retrieval</a> · <a href="https://github.com/Beeeeeeelle/review-evidence-workflow">Review Evidence Workflow</a></p></footer>
<script>
const q=s=>document.querySelector(s),film=q('#film'),chapter=q('#chapter'),position=q('#position');
const query=new URLSearchParams(location.search);let lang=query.get('lang')==='en'?'en':'zh-CN',kind=query.get('video')==='pilot'?'pilot':'intro',library=[],buttons=[],current=null;
const words={
 'zh-CN':{heading:'从文献清单，到有依据的审阅',subtitle:'先认识两个 skill 怎样配合，再看实际工作台怎样操作。',intro:'① 先认识两个 skill',pilot:'② 再看实际操作',chapters:'想先看哪一步？',ready:'点击播放，或从右侧选一章开始。',download:'下载视频',transcript:'阅读解说',guide:'使用指南',source:'画面与标注说明',speech:'中文合成解说',count:'章 · 可点击跳转',note:'总览结合流程示意、已有 Belle 概念插画和真实界面截图。R017 是交接示例；独立表单使用模拟资料；TALL 与 Agency 图片是注明来源的适配展示。操作导览使用真实 Pilot 截图和独立演示反馈。圈线、箭头与镜头裁切是后期引导，均非连续录屏；黄色引文高亮来自实际阅读器。',introLegend:'橙色引导当前步骤；画面下方保留流程位置。',pilotLegend:'橙色圈框：看这里　·　青色箭头：回到原文　·　黄色：阅读器的引文定位'},
 en:{heading:'From a study list to an evidence-linked review',subtitle:'First meet the two skills. Then explore the actual workbench.',intro:'① Meet the two skills',pilot:'② Explore the workbench',chapters:'Where would you like to start?',ready:'Press play, or choose a chapter on the right.',download:'Download video',transcript:'Read the transcript',guide:'Read the guide',source:'About the visuals',speech:'English synthetic narration',count:'chapters · click to jump',note:'The introduction combines workflow diagrams, existing Belle concept illustrations and actual interface captures. R017 is an illustrative handoff; the independent form uses fictional data; TALL and Agency images are attributed case adaptations. The workbench tour uses real Pilot captures and separate demo responses. Circles, arrows and camera crops are editorial guidance, not a continuous recording. Yellow quotation highlights come from the functioning reader.',introLegend:'Orange identifies the current step; the journey stays visible below.',pilotLegend:'Orange: look here · Teal: follow the evidence · Yellow: reader quotation match'}
};
function clock(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');}
function select(){
 const w=words[lang];current=library.find(v=>v.lang===lang&&v.kind===kind);if(!current)return;
 document.documentElement.lang=lang;document.title=w.heading;q('#heading').textContent=w.heading;q('#subtitle').textContent=w.subtitle;
 for(const el of document.querySelectorAll('[data-lang]'))el.setAttribute('aria-pressed',String(el.dataset.lang===lang));
 for(const el of document.querySelectorAll('[data-kind]')){el.setAttribute('aria-pressed',String(el.dataset.kind===kind));el.textContent=w[el.dataset.kind];}
 q('#chapters-title').textContent=w.chapters;q('.chapters').setAttribute('aria-label',lang==='en'?'Video chapters':'视频章节');chapter.textContent=w.ready;position.textContent='00:00';
 q('#hint').textContent=clock(Math.round(current.duration))+' · '+w.speech+' · '+current.chapters.length+' '+w.count;
 q('#legend').textContent=kind==='intro'?w.introLegend:w.pilotLegend;
 for(const id of ['download','transcript','guide']){q('#'+id).textContent=w[id];q('#'+id).href=id==='download'?current.src:current[id];}
 q('#source-summary').textContent=w.source;q('#source-note').textContent=w.note;
 film.pause();film.poster=current.poster;film.src=current.src;film.load();
 q('#chapter-buttons').replaceChildren();buttons=current.chapters.map((c,i)=>{const b=document.createElement('button');b.type='button';b.dataset.time=c.start;const s=document.createElement('span');s.textContent=String(i+1).padStart(2,'0')+' · '+clock(c.start);b.append(s,document.createTextNode(c.title));b.addEventListener('click',()=>{film.currentTime=c.start;film.play().catch(()=>{chapter.textContent=w.ready;});});q('#chapter-buttons').append(b);return b;});
 history.replaceState(null,'','?video='+kind+'&lang='+lang);
}
for(const el of document.querySelectorAll('[data-lang]'))el.addEventListener('click',()=>{lang=el.dataset.lang;select();});
for(const el of document.querySelectorAll('[data-kind]'))el.addEventListener('click',()=>{kind=el.dataset.kind;select();});
film.addEventListener('timeupdate',()=>{let index=-1;for(let i=0;i<buttons.length;i++)if(Number(buttons[i].dataset.time)<=film.currentTime)index=i;buttons.forEach((b,i)=>{b.classList.toggle('active',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});position.textContent=clock(film.currentTime);if(index>=0)chapter.textContent=current.chapters[index].title;});
fetch('videos.json').then(r=>{if(!r.ok)throw new Error('Video manifest unavailable');return r.json();}).then(v=>{library=v;select();}).catch(()=>{chapter.textContent=lang==='en'?'Start the local server described in the README to view the chapter player.':'请按 README 启动本地服务，再使用章节播放器。';});
</script></body></html>
