<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="Agency: separate source reporting, coding and synthesis"><title>Agency: separate source reporting, coding and synthesis</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#525252"/></marker><marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D97745"/></marker></defs><text x="40" y="42" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#5F7FA3" text-anchor="start"><tspan x="40" dy="0">CASE 02 / AGENCY</tspan></text><text x="40" y="87" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="32" font-weight="700" fill="#0A0A0A" text-anchor="start"><tspan x="40" dy="0">From one review to a cross-review claim</tspan></text><rect x="40" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="40" y="122" width="4" height="246" fill="#525252"/><text x="62" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#525252" text-anchor="start"><tspan x="62" dy="0">01 · SOURCE REPORTING</tspan></text><text x="62" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="62" dy="0">What the review reports</tspan></text><text x="62" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="62" dy="0">Measurement types:</tspan><tspan x="62" dy="28.0">“self-report or</tspan><tspan x="62" dy="28.0">behavioural/trace”</tspan><tspan x="62" dy="28.0">MR00192 · PDF p. 6</tspan></text><rect x="400" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="400" y="122" width="4" height="246" fill="#D97745"/><text x="422" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#D97745" text-anchor="start"><tspan x="422" dy="0">02 · DESCRIPTIVE CODING</tspan></text><text x="422" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="422" dy="0">Apply the team’s rule</tspan></text><text x="422" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="422" dy="0">Measurement types are</tspan><tspan x="422" dy="28.0">explicitly differentiated.</tspan><tspan x="422" dy="28.0">Keep the quote and location.</tspan><tspan x="422" dy="28.0">People verify the interpretation.</tspan></text><rect x="760" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="760" y="122" width="4" height="246" fill="#5F7FA3"/><text x="782" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#5F7FA3" text-anchor="start"><tspan x="782" dy="0">03 · CROSS-REVIEW SYNTHESIS</tspan></text><text x="782" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="782" dy="0">Needs multiple reviews</tspan></text><text x="782" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="782" dy="0">What converges or conflicts?</tspan><tspan x="782" dy="28.0">Are underlying studies shared?</tspan><tspan x="782" dy="28.0">One review alone cannot</tspan><tspan x="782" dy="28.0">establish an agency effect.</tspan></text><path d="M340 242 H392" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 242 H752" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="40" y="408" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#525252" text-anchor="start"><tspan x="40" dy="0">Agency is a review-level pilot adaptation, not a completed synthesis or independent validation.</tspan><tspan x="40" dy="32">Source links, layered coding and reviewer returns transfer; units and research rules remain project-specific.</tspan></text></svg>