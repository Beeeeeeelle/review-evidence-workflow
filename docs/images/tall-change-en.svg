height="200" fill="#D97745"/><text x="422" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#D97745" text-anchor="start"><tspan x="422" dy="0">02 · HUMAN ADJUDICATION</tspan></text><text x="422" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="422" dy="0">Adjudicated state</tspan></text><text x="422" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="422" dy="0">Q2: No</tspan><tspan x="422" dy="28.0">Q4: No</tspan><tspan x="422" dy="28.0">Gate: FAIL</tspan></text><rect x="760" y="122" width="300" height="200" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="760" y="122" width="4" height="200" fill="#5F7FA3"/><text x="782" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#5F7FA3" text-anchor="start"><tspan x="782" dy="0">03 · SKILL CONSEQUENCE</tspan></text><text x="782" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="782" dy="0">Revisit affected work</tspan></text><text x="782" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="782" dy="0">Flag registered dependencies.</tspan><tspan x="782" dy="28.0">Reverify / recompute.</tspan><tspan x="782" dy="28.0">Preserve history and reasons.</tspan></text><path d="M340 222 H392" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 222 H752" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="40" y="363" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#525252" text-anchor="start"><tspan x="40" dy="0">First two boxes: the retained I031 record (2026-07-20). Third: the reusable skill’s required response.</tspan><tspan x="40" dy="32">The Q2/Q4 gate is specific to TALL; it is not a universal MMAT cutoff.</tspan><tspan x="40" dy="32">Screening remained Include. The historical revision is not an independent validity benchmark.</tspan></text></svg>