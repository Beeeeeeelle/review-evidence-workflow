<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="Agency：原文、编码和综合的边界"><title>Agency：原文、编码和综合的边界</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#525252"/></marker><marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D97745"/></marker></defs><text x="40" y="42" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#5F7FA3" text-anchor="start"><tspan x="40" dy="0">CASE 02 / AGENCY</tspan></text><text x="40" y="87" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="32" font-weight="700" fill="#0A0A0A" text-anchor="start"><tspan x="40" dy="0">从一篇 review 到跨 review 的判断</tspan></text><rect x="40" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="40" y="122" width="4" height="246" fill="#525252"/><text x="62" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#525252" text-anchor="start"><tspan x="62" dy="0">01 · SOURCE / 原文</tspan></text><text x="62" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="62" dy="0">原文怎样报告</tspan></text><text x="62" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="62" dy="0">Measurement types:</tspan><tspan x="62" dy="28.0">“self-report or</tspan><tspan x="62" dy="28.0">behavioural/trace”</tspan><tspan x="62" dy="28.0">MR00192 · PDF p. 6</tspan></text><rect x="400" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="400" y="122" width="4" height="246" fill="#D97745"/><text x="422" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#D97745" text-anchor="start"><tspan x="422" dy="0">02 · CODING / 编码</tspan></text><text x="422" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="422" dy="0">按人的规则解释</tspan></text><text x="422" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="422" dy="0">测量类型有明确区分</tspan><tspan x="422" dy="28.0">保留原文及页码</tspan><tspan x="422" dy="28.0">人核验这个解释</tspan></text><rect x="760" y="122" width="300" height="246" rx="5" fill="#fff" stroke="#D8DDE2"/><rect x="760" y="122" width="4" height="246" fill="#5F7FA3"/><text x="782" y="149" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#5F7FA3" text-anchor="start"><tspan x="782" dy="0">03 · SYNTHESIS / 综合</tspan></text><text x="782" y="181" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" fill="#0A0A0A" text-anchor="start"><tspan x="782" dy="0">需要多篇 review</tspan></text><text x="782" y="211" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#525252" text-anchor="start"><tspan x="782" dy="0">跨研究有哪些一致与差异？</tspan><tspan x="782" dy="28.0">来源是否重复？</tspan><tspan x="782" dy="28.0">不能从单篇直接得出</tspan><tspan x="782" dy="28.0">agency 增强或削弱。</tspan></text><path d="M340 242 H392" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 242 H752" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="40" y="408" font-family="Helvetica Neue,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#525252" text-anchor="start"><tspan x="40" dy="0">Agency 是 review 层级的试点适配，尚不是完成的跨 review 综合或独立验证。</tspan><tspan x="40" dy="32">复用的是原文定位、分层编码、个人审阅和回传流程；研究单位与规则由项目定义。</tspan></text></svg>